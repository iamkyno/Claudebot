# Exness SMC scalper — MetaTrader 5
#
# mode:
#   dry-run  only logs "would BUY 0.01 XAUUSD SL… TP…" (default, safe)
#   demo     sends real orders, but refuses unless MT5 is on a DEMO account
#   live     real money; also needs allow_live: true below
mode: dry-run
allow_live: false

mt5:
  server_utc_offset_hours: 0   # Exness MT5 server time is UTC (GMT+0)
  magic: 7140001               # tags this bot's orders so it never touches yours
  deviation_points: 30         # max slippage accepted on market orders
  bridge:                      # macOS: the MT5 bridge running in Wine (scripts/mac/start_bridge.sh)
    host: 127.0.0.1
    port: 18812

loop_seconds: 5                # how often to poll; signals are only read on new M1 closes

# Base names. Exness suffixes (e.g. XAUUSDm on Standard accounts) are found automatically.
# Sessions are in SAST (UTC+2). "always" = 24/7.
symbols:
  XAUUSD:
    sessions:
      - {days: [mon, tue, wed, thu, fri], start: "09:00", end: "22:00"}
  BTCUSD:
    sessions: always

# SMC: M5 market structure sets the direction; M1 times the entry.
# Long entry (shorts are the mirror):
#   1. M5 bias is up (last break of structure was upward)
#   2. M1 sweeps a swing low (liquidity grab)
#   3. M1 closes above the swing high that preceded the sweep (CHoCH)
#   4. price retraces into the fair value gap left by that move -> buy
strategy:
  trend_bars: 300              # M5 bars used for bias (~25h)
  entry_bars: 150              # M1 bars scanned for the setup (~2.5h)
  trend_swing_length: 3        # bars each side that make an M5 swing point
  entry_swing_length: 2        # same on M1
  max_setup_age_bars: 15       # a structure break older than this many M1 bars is stale
  sweep_max_atr: 1.5           # deeper than this past the low = breakdown, not a sweep
  fvg_min_atr: 0.05            # ignore gaps smaller than this fraction of ATR
  sl_buffer_atr: 0.1           # stop sits this far beyond the sweep wick
  min_sl_atr: 0.5              # never a stop tighter than this
  max_sl_atr: 4.0              # skip setups needing a wider stop
  reward_risk: 1.8             # TP = 1.8R
  atr_period: 14

risk:
  risk_per_trade_pct: 0.5      # % of equity lost if the stop is hit
  max_trades_per_day: 6        # per SAST day, all symbols
  max_daily_loss_pct: 2.0      # equity drawdown from the SAST day's start that halts trading
  max_spread_to_sl: 0.25       # skip if spread > 25% of the stop distance
  max_open_per_symbol: 1
  max_hold_minutes: 30         # close a scalp that hasn't resolved by then
  kill_file: KILL              # create a file named KILL in this folder to halt new trades

journal:
  path: journal/journal.db

imessage:
  enabled: false               # recipient (phone or Apple ID email) goes in .env as IMESSAGE_TO

backtest:
  spread:                      # price units, used when the data has no spread column
    XAUUSD: 0.20
    BTCUSD: 15.0
