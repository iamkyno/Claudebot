# Claudebot configuration
# Only fields here are infrastructure settings.
# All strategy thresholds are computed automatically from market data.

binance:
  testnet: false
  max_symbols: 20            # number of top USDT pairs to trade
  min_volume_usdt: 15000000  # minimum 24h volume in USDT to be eligible
  timeframe: "1h"

database:
  host: localhost
  port: 5432
  name: claudebot

risk:
  max_portfolio_risk_pct: 0.02    # max 2% of balance at risk per trade
  max_daily_loss_pct: 0.05        # 5% daily drawdown kills trading for the day
  max_strategy_daily_loss_pct: 0.03
  max_concurrent_positions: 10
  max_positions_per_symbol: 2
  cash_reserve_pct: 0.20          # 20% always held as cash buffer
  atr_stop_multiplier: 1.5
  use_kelly_sizing: true          # size by edge quality (ML win prob), capped by max_risk
  kelly_fraction: 0.5             # half-Kelly — smoother than full-Kelly

# Trading-cost model. Applied to every paper fill and every PnL calculation so
# paper results mean what they say. Live fills also net these out.
fees:
  spot_taker: 0.001               # 0.10% per side (Binance spot, no BNB discount)
  futures_taker: 0.0005           # 0.05% per side (USDT-M futures)
  slippage_bps: 2                 # est. market-order slippage per side (basis points)

# Futures settings used when shorts go live (paper shorts are fully simulated).
futures:
  leverage: 2                     # conservative default
  margin_mode: isolated           # isolate margin per position

# Advanced engine features. Every one is independently switchable so you can
# A/B them. All default ON.
features:
  websocket_prices: true          # live WS price feed (ms-fresh fills + trailing)
  short_selling: true             # act on 'sell' signals (futures shorts)
  trailing_stops: true            # ratchet stops toward price to lock gains
  partial_take_profit: true       # bank a slice at TP1, move stop to breakeven
  regime_filter: true             # only run a strategy in the regime it suits
  mtf_confirmation: true          # gate entries on the higher timeframe trend
  sentiment_filter: true          # fear&greed + aggregate funding crowd gate
  sharpe_sizing: true             # allocate capital by rolling risk-adjusted perf
  htf_timeframe: "4h"             # higher timeframe used for MTF confirmation
  tp1_ratio: 0.5                  # TP1 triggers at this fraction of the way to TP
  tp1_close_fraction: 0.5         # close this fraction of the position at TP1

ml:
  min_trades_to_train: 50
  model_path: "ml/models/"
  confidence_threshold: 0.60     # ML must score a signal >= this to trade
  retrain_every_trades: 100      # also retrains once per day automatically
  label_min_edge: 0.0015         # a trade counts as a "win" only if it cleared
                                 # this net % (beats fees) — fee-aware labels

telegram:
  enabled: false

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8080

scalp:
  enabled: true
  venue: futures             # fee model used for sizing targets (futures taker ~0.05%)
  entry_timeframe: "1m"      # signals are read here
  trend_timeframe: "5m"      # higher-TF gate: never scalp against this trend
  max_symbols: 8             # only scalp the most liquid pairs
  taker_fee_rate: 0.0005     # 0.05% per side (futures). Spot is ~0.001
  scalp_time_stop_min: 15    # cut a scalp that hasn't worked in N minutes

bot:
  loop_interval_seconds: 60
  paper_mode: true               # set to false when ready to go live
  paper_balance_usdt: 10000      # virtual starting wallet for paper trading
  symbol_refresh_hours: 4        # how often to re-rank tradeable symbols
  use_tradingview: true          # keyless TradingView consensus confirmation
  tradingview_veto_score: -0.5   # skip buys when TV consensus <= this (-1..1)
